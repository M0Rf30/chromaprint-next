[package]
name = "chromaprint-next"
version = "0.1.0"
edition = "2021"
description = "Audio fingerprinting library (Rust port of Chromaprint)"
license = "MIT AND LGPL-2.1-or-later"

[lib]
name = "chromaprint"

[features]
default = []
async = ["dep:tokio"]
parallel = ["dep:rayon"]

[dependencies]
realfft = "3"
rayon = { version = "1", optional = true }
tokio = { version = "1", features = ["io-util", "rt"], optional = true }
base64 = "0.22"
thiserror = "2"
